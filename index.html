
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donasi - Nookleaf Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 28px;
            letter-spacing: 1px;
        }
        p {
            margin-bottom: 20px;
            color: #d1e0fc;
            font-size: 15px;
        }
        
        /* Gaya untuk Pilihan Mata Uang */
        .currency-selector {
            margin-bottom: 15px;
            font-size: 14px;
        }
        .currency-selector select {
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            background-color: rgba(255, 255, 255, 0.9);
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        /* Gaya untuk Progress Bar */
        .progress-wrapper {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .progress-title {
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-fill {
            height: 100%;
            background-color: #4CAF50;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }
        .progress-stats {
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            color: #d1e0fc;
        }

        /* Gaya untuk Tombol */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s, opacity 0.2s;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
        .btn-tako { background-color: #e53935; }
        .btn-saweria { background-color: #d4af37; }
        .btn-wa { background-color: #25D366; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nookleaf Project</h1>
        <p>Dukung terus pengembangan sistem kami!</p>

        <!-- Dropdown Pilih Mata Uang -->
        <div class="currency-selector">
            <label for="currency-select">Tampilkan Saldo dalam: </label>
            <select id="currency-select" onchange="updateDisplay()">
                <option value="IDR">🇮🇩 Rupiah (IDR)</option>
                <option value="USD">🇺🇸 Dollar (USD)</option>
            </select>
        </div>

        <!-- Progress Bar Section -->
        <div class="progress-wrapper">
            <div class="progress-title" id="target-amount">Target Donasi: Rp 10.000.000</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-stats">
                <span id="current-amount">Terkumpul: Rp 0</span>
                <span id="percentage">0%</span>
            </div>
        </div>

        <a href="https://tako.id/hananookleafproject/gift" class="btn btn-tako" target="_blank">🐙 Traktir Tako</a>
        <a href="https://saweria.co/tetoyapping29312" class="btn btn-saweria" target="_blank">💸 Top Up via Saweria</a>
        <a href="https://wa.me/6282157833066?text=Halo%20Zaki,%20saya%20ingin%20berdonasi%20secara%20manual%20untuk%20Nookleaf%20Project" class="btn btn-wa" target="_blank">📱 Manual via WhatsApp</a>
    </div>

    <!-- Script Kalkulasi Otomatis & Ganti Mata Uang -->
    <script>
        // ==========================================
        // 1. ATUR SALDO DAN KURS DI SINI
        // ==========================================
        const saldoTakoUSD = 2.80;
        const saldoSafelinkuUSD = 1.810883;
        const saldoTakoIDR = 9800; // Donasi yang masuk dalam bentuk Rupiah
        
        const kursUSDkeIDR = 15500; // Kurs tukar 1 USD ke IDR
        const targetIDR = 10000000; // Target 10 Juta Rupiah

        // ==========================================
        // 2. LOGIKA PERHITUNGAN
        // ==========================================
        // Hitung semua ke base Rupiah (IDR)
        const totalUSD_to_IDR = (saldoTakoUSD + saldoSafelinkuUSD) * kursUSDkeIDR;
        const totalKeseluruhanIDR = totalUSD_to_IDR + saldoTakoIDR;
        
        // Hitung semua ke base Dollar (USD)
        const targetUSD = targetIDR / kursUSDkeIDR;
        const totalKeseluruhanUSD = totalKeseluruhanIDR / kursUSDkeIDR;

        // Persentase Progres
        let persentase = (totalKeseluruhanIDR / targetIDR) * 100;
        if (persentase > 100) persentase = 100; // Maksimal tampilan bar 100%

        // ==========================================
        // 3. FUNGSI UPDATE TAMPILAN
        // ==========================================
        function updateDisplay() {
            const currency = document.getElementById('currency-select').value;
            const targetEl = document.getElementById('target-amount');
            const currentEl = document.getElementById('current-amount');
            
            // Format angka ke mata uang yang dipilih
            if (currency === 'IDR') {
                targetEl.innerText = 'Target Donasi: ' + formatCurrency(targetIDR, 'IDR');
                currentEl.innerText = 'Terkumpul: ' + formatCurrency(totalKeseluruhanIDR, 'IDR');
            } else {
                targetEl.innerText = 'Target Donasi: ' + formatCurrency(targetUSD, 'USD');
                currentEl.innerText = 'Terkumpul: ' + formatCurrency(totalKeseluruhanUSD, 'USD');
            }
            
            // Update bar progres
            document.getElementById('progress-fill').style.width = persentase + '%';
            document.getElementById('percentage').innerText = persentase.toFixed(2) + '%';
        }

        function formatCurrency(amount, curr) {
            return new Intl.NumberFormat(curr === 'IDR' ? 'id-ID' : 'en-US', {
                style: 'currency',
                currency: curr,
                minimumFractionDigits: curr === 'IDR' ? 0 : 2,
                maximumFractionDigits: curr === 'IDR' ? 0 : 2
            }).format(amount);
        }

        // Jalankan fungsi saat halaman pertama kali dimuat
        updateDisplay();
    </script>
</body>
</html>
